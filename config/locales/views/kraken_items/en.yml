---
en:
  # Settings panel - must be at root level for view lookup
  settings:
    providers:
      kraken_panel:
        setup_instructions: "To connect Kraken:"
        step1_html: "Go to <a href=\"https://pro.kraken.com/app/settings/api\" target=\"_blank\" class=\"link\">Kraken API settings</a>"
        step2: "Create a new API key with permissions: Funds permissions > Query & Data > Query ledger entries"
        step3: "Copy your API key and API secret and paste them below"
        api_key_label: "API Key"
        api_key_placeholder: "Enter your Kraken API Key"
        api_secret_label: "API Secret (Private Key)"
        api_secret_placeholder: "Enter your Kraken API Secret"
        connect_button: "Connect Kraken"
        sync: "Sync"
        status_connected: "Connected to Kraken"
        status_not_connected: "Not connected. Enter your API credentials above to get started."
        syncing: "Syncing..."
        disconnect_confirm: "Are you sure you want to disconnect your Kraken account?"

  kraken_items:
    # Model method strings
    sync_status:
      no_accounts: "No portfolio found"
      synced:
        one: "%{count} portfolio synced"
        other: "%{count} portfolios synced"
      synced_with_setup: "%{linked} synced, %{unlinked} need setup"
    institution_summary:
      none: "No Kraken connection"
      count:
        one: "%{count} Kraken connection"
        other: "%{count} Kraken connections"
    errors:
      provider_not_configured: "Kraken provider is not configured"

    # Syncer status messages
    sync:
      status:
        importing: "Importing portfolio from Kraken..."
        processing: "Processing holdings and ledger..."
        calculating: "Calculating balances..."
        importing_data: "Importing portfolio data..."
        checking_setup: "Checking portfolio configuration..."
        needs_setup: "Portfolio needs setup..."
      success: "Sync started"

    # Panel (settings view)
    panel:
      setup_instructions: "Connect your Kraken exchange account to import your crypto portfolio, including spot holdings, staked assets, and earn positions."
      step1: "Generate API keys in your Kraken account settings with 'Query' permissions"
      step2: "Enter your API Key and Private Key (API Secret) below"
      step3: "Click Connect to import your portfolio"
      save_button: "Connect Kraken"
      update_button: "Update Credentials"
      status_configured_html: "Connected to Kraken. Visit the <a href=\"%{accounts_path}\" class=\"link\">Accounts</a> tab to view your portfolio."
      status_not_configured: "Not connected to Kraken"
      fields:
        api_key:
          label: "API Key"
          description: "Your Kraken API Key"
          placeholder_new: "Paste your API Key here"
          placeholder_update: "Enter new API Key to update"
        api_secret:
          label: "API Secret (Private Key)"
          description: "Your Kraken API Secret"
          placeholder_new: "Paste your API Secret here"
          placeholder_update: "Enter new API Secret to update"

    # CRUD success messages
    create:
      success: "Kraken connection created successfully"
    update:
      success: "Kraken connection updated"
    destroy:
      success: "Kraken connection removed"
    index:
      title: "Kraken Connections"

    # Loading states
    loading:
      loading_message: "Loading Kraken portfolio..."
      loading_title: "Loading"

    # Provider item display (used in _kraken_item partial)
    kraken_item:
